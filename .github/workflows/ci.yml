name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      admin: ${{ steps.filter.outputs.admin }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: filter
        name: Detect the parts that changed
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            files="*"
          fi
          echo "$files"

          touched() {
            [ "$files" = "*" ] && return 0
            echo "$files" | grep -qE '^\.github/workflows/ci\.yml$' && return 0
            echo "$files" | grep -qE "$1"
          }

          go=false
          touched '(\.go$|^go\.(mod|sum)$|^Makefile$|^\.golangci\.yml$|^sqlc\.yaml$|^migrations/|^internal/|^docs/openapi\.yaml$)' && go=true

          admin=false
          [ -f admin/package.json ] && touched '(^admin/|^docs/openapi\.yaml$)' && admin=true

          mobile=false
          [ -f mobile/package.json ] && touched '(^mobile/|^docs/openapi\.yaml$)' && mobile=true

          {
            echo "go=$go"
            echo "admin=$admin"
            echo "mobile=$mobile"
          } | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  vuln:
    name: Vulnerabilities
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: make vuln

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: make test

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet -tags=integration ./...

      - name: Integration tests
        run: make itest

  admin:
    name: Admin
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: API types are up to date
        run: |
          npm run api-types
          git diff --exit-code -- src/api/schema.ts

      - name: Tests
        run: npm test -- --run

      - name: Types and build
        run: npm run build

  e2e:
    name: Admin E2E
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: league_s
          POSTGRES_USER: league_s
          POSTGRES_PASSWORD: league_s
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U league_s -d league_s"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PORT: 8080
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: league_s
      DB_USERNAME: league_s
      DB_PASSWORD: league_s
      COOKIE_SECURE: false
      LOG_FORMAT: text
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install goose
        run: go install "github.com/pressly/goose/v3/cmd/goose@$(go list -m -f '{{.Version}}' github.com/pressly/goose/v3)"

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci

      - name: Install Chromium
        working-directory: admin
        run: npx playwright install --with-deps chromium

      - name: Migrate, build, seed and run the E2E tests
        run: make e2e-run

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci

      - name: API types are up to date
        run: |
          npm run api-types
          git diff --exit-code -- src/types/api.ts

      - name: Tests
        run: npm test -- --ci

      - name: Expo types
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Types
        run: npx tsc --noEmit

  mobile-e2e:
    name: Mobile E2E
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.mobile == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PORT: 8080
      DB_HOST: localhost
      DB_PORT: 5432
      DB_DATABASE: league_s
      DB_USERNAME: league_s
      DB_PASSWORD: league_s
      COOKIE_SECURE: false
      LOG_FORMAT: text
      EXPO_PUBLIC_API_URL: http://localhost:8080/api/v1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Start Postgres
        run: |
          brew install postgresql@18
          brew services start postgresql@18
          pg="$(brew --prefix postgresql@18)/bin"
          until "$pg/pg_isready" -h localhost; do sleep 1; done
          "$pg/psql" -h localhost -d postgres -c "CREATE ROLE league_s LOGIN PASSWORD 'league_s'"
          "$pg/createdb" -h localhost -O league_s league_s

      - name: Install goose
        run: go install "github.com/pressly/goose/v3/cmd/goose@$(go list -m -f '{{.Version}}' github.com/pressly/goose/v3)"

      - name: Migrate, start the API and seed
        run: |
          make migrate-up
          go build -o main ./cmd/api
          ./main > api.log 2>&1 &
          until curl -sf localhost:8080/health; do sleep 1; done
          go run ./cmd/seed

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start the app in Expo Go
        working-directory: mobile
        run: |
          npx expo start --ios > ../expo.log 2>&1 &
          for _ in $(seq 1 300); do
            grep -q "iOS Bundled" ../expo.log && exit 0
            sleep 2
          done
          cat ../expo.log
          exit 1

      - name: Maestro flows
        env:
          MAESTRO_CLI_NO_ANALYTICS: 1
        run: maestro test mobile/e2e/ --debug-output "$GITHUB_WORKSPACE/maestro-debug" --flatten-debug-output --test-output-dir "$GITHUB_WORKSPACE/maestro-output"

      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-e2e
          path: |
            api.log
            expo.log
            maestro-debug
            maestro-output
