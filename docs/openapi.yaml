openapi: 3.1.0
info:
  title: league-s API
  version: 1.0.0
  description: |
    JSON API for amateur football leagues. Every league is separate: a resource of
    another league is a 404.

    - IDs are UUID v7. Date-times are UTC (RFC 3339). Dates are `YYYY-MM-DD`.
    - Errors are `{"error": "..."}`. Field validation errors are
      `{"errors": {"<field>": "<rule>"}}` with a 422.
    - Reads are public. Writes need a session (cookie `session`, or
      `Authorization: Bearer <token>`) of an admin of the league in the URL, or of a
      superadmin. The access rule of each operation is in its description.

    `internal/server/openapi_test.go` fails when a route of the router is missing
    from this file, or when an operation here is not in the router.
servers:
  - url: /
security:
  - sessionCookie: []
  - bearerToken: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Database health
      description: "Access: public."
      security: []
      responses:
        "200":
          description: The database answers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The database does not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Log in
      description: |
        Access: public. Sets the `session` cookie. Rate limited to 10 requests per
        minute per IP, with the other `/auth` routes.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: "Access: public. Ends the current session, if any, and clears the cookie."
      tags: [auth]
      security: []
      responses:
        "204":
          description: Logged out.
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Ask for a password reset link
      description: "Access: public. Answers 204 whether the account exists or not."
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Request accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/password-reset/confirm:
    post:
      operationId: resetPassword
      summary: Choose a new password with a reset link
      description: "Access: public."
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/me:
    get:
      operationId: getMe
      summary: Current user and the leagues they administer
      description: "Access: logged in."
      tags: [auth]
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/password:
    put:
      operationId: changePassword
      summary: Change one's password
      description: "Access: logged in. Ends the user's other sessions."
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/invitations/lookup:
    post:
      operationId: lookUpInvitation
      summary: Read a pending invitation from its link
      description: |
        Access: public. Tells the invited person which league invites them, and
        whether an account already exists for their email. Rate limited with the
        `/auth` routes.
      tags: [invitations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: The pending invitation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingInvitation"
        "400":
          description: Invalid JSON body, or the link is unknown, used, cancelled or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Access: public. Makes the invited email an admin of the league. Without an
        account for that email, `name` and `password` are required and the account is
        created. With one, they are ignored. The link works once.
      tags: [invitations]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "204":
          description: Accepted.
        "400":
          description: Invalid JSON body, or the link is unknown, used, cancelled or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/leagues:
    get:
      operationId: listLeagues
      summary: List leagues, sorted by name
      description: "Access: public."
      tags: [leagues]
      security: []
      responses:
        "200":
          description: Every league.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/League"
    post:
      operationId: createLeague
      summary: Create a league
      description: "Access: superadmin."
      tags: [leagues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeagueRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    get:
      operationId: getLeague
      summary: Read a league
      description: "Access: public."
      tags: [leagues]
      security: []
      responses:
        "200":
          description: The league.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateLeague
      summary: Change a league's name or logo
      description: "Access: league admin. Only the fields sent change; `null` or omitted keeps the value."
      tags: [leagues]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeagueRequest"
      responses:
        "200":
          description: The league after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/League"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteLeague
      summary: Delete a league
      description: "Access: superadmin. Refused (409) while the league has teams, players or seasons."
      tags: [leagues]
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/leagues/{leagueID}/invitations:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    get:
      operationId: listInvitations
      summary: List the league's pending invitations
      description: "Access: superadmin. Used, cancelled and expired invitations are left out. The links are never returned again."
      tags: [invitations]
      responses:
        "200":
          description: The pending invitations, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: inviteLeagueAdmin
      summary: Invite someone to administer the league
      description: |
        Access: superadmin. Returns the link once; it is valid 7 days and works once.
        A new invitation to the same email replaces the pending one. Refused (409) when
        the email is already an admin of the league.
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/invitations/{invitationID}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/InvitationID"
    delete:
      operationId: cancelInvitation
      summary: Cancel a pending invitation
      description: "Access: superadmin. Its link stops working."
      tags: [invitations]
      responses:
        "204":
          description: Cancelled.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/leagues/{leagueID}/admins:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    get:
      operationId: listLeagueAdmins
      summary: List the league's admins, sorted by name
      description: "Access: league admin."
      tags: [invitations]
      responses:
        "200":
          description: The league's admins.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeagueAdmin"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/leagues/{leagueID}/admins/{userID}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/UserID"
    delete:
      operationId: removeLeagueAdmin
      summary: Remove an admin from the league
      description: "Access: superadmin. The account is kept."
      tags: [invitations]
      responses:
        "204":
          description: Removed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/leagues/{leagueID}/teams:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    get:
      operationId: listTeams
      summary: List the league's teams, sorted by name
      description: "Access: public. An unknown league gives an empty list."
      tags: [teams]
      security: []
      responses:
        "200":
          description: The league's teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createTeam
      summary: Create a team
      description: "Access: league admin. The name is unique in the league (409)."
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/teams/{teamID}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/TeamID"
    get:
      operationId: getTeam
      summary: Read a team
      description: "Access: public."
      tags: [teams]
      security: []
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTeam
      summary: Change a team's name or logo
      description: "Access: league admin. Only the fields sent change; `null` or omitted keeps the value. The name is unique in the league (409)."
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: The team after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteTeam
      summary: Delete a team
      description: "Access: league admin. Refused (409) while the team is registered in a season."
      tags: [teams]
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/leagues/{leagueID}/players:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    get:
      operationId: listPlayers
      summary: List or search the league's players, sorted by last name then first name
      description: "Access: public. An unknown league is a 404."
      tags: [players]
      security: []
      parameters:
        - name: q
          in: query
          required: false
          description: |
            Case-insensitive search in "first name last name" and "last name first
            name". At most 100 characters (400 otherwise).
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: The matching players.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createPlayer
      summary: Create a player
      description: "Access: league admin."
      tags: [players]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/players/{playerID}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/PlayerID"
    get:
      operationId: getPlayer
      summary: Read a player
      description: "Access: public."
      tags: [players]
      security: []
      responses:
        "200":
          description: The player.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePlayer
      summary: Change a player's name or icon
      description: "Access: league admin. Only the fields sent change; `null` or omitted keeps the value."
      tags: [players]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerRequest"
      responses:
        "200":
          description: The player after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deletePlayer
      summary: Delete a player
      description: "Access: league admin. Refused (409) once the player has been in a squad."
      tags: [players]
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/leagues/{leagueID}/seasons:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
    get:
      operationId: listSeasons
      summary: List the league's seasons, most recent first
      description: "Access: public."
      tags: [seasons]
      security: []
      responses:
        "200":
          description: The league's seasons.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Season"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: createSeason
      summary: Create a season
      description: "Access: league admin. The name is unique in the league (409). The season's dates, first and last days included, must not overlap another season of the league (409)."
      tags: [seasons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
    get:
      operationId: getSeason
      summary: Read a season
      description: "Access: public."
      tags: [seasons]
      security: []
      responses:
        "200":
          description: The season.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateSeason
      summary: Change a season's name, dates, points or tie breakers
      description: "Access: league admin. Only the fields sent change; `null` or omitted keeps the value. The name is unique in the league (409). The end must stay after the start (422). The new dates, first and last days included, must not overlap another season of the league (409). The standings are computed on read, so they follow the new points and tie breakers."
      tags: [seasons]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeasonRequest"
      responses:
        "200":
          description: The season after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Season"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteSeason
      summary: Delete a season
      description: "Access: league admin. Refused (409) while the season has matches. Its team registrations and squads are deleted with it."
      tags: [seasons]
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/teams:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
    get:
      operationId: listSeasonTeams
      summary: List the teams registered in the season
      description: "Access: public."
      tags: [seasons]
      security: []
      responses:
        "200":
          description: The registered teams.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamRef"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/teams/{teamID}:
