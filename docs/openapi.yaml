      tags: [squad]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeNumberRequest"
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/teams/{teamID}/squad/{membershipID}/leave:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
      - $ref: "#/components/parameters/TeamID"
      - $ref: "#/components/parameters/MembershipID"
    post:
      operationId: leaveSquad
      summary: A player leaves the squad
      description: "Access: league admin."
      tags: [squad]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaveSquadRequest"
      responses:
        "200":
          description: Left.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/transfers:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
    post:
      operationId: transferPlayer
      summary: Move a player from one squad to another
      description: "Access: league admin. Leaves then joins, in one transaction. Returns the new membership."
      tags: [squad]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "201":
          description: Transferred.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/matches:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
    get:
      operationId: listMatches
      summary: The season's fixtures
      description: "Access: public."
      tags: [matches]
      security: []
      parameters:
        - name: matchday
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: from
          in: query
          description: First day, included.
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Last day, included.
          schema:
            type: string
            format: date
        - name: team
          in: query
          description: Matches where this team plays home or away.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MatchStatus"
      responses:
        "200":
          description: The matches.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: scheduleMatch
      summary: Schedule a match
      description: "Access: league admin."
      tags: [matches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleMatchRequest"
      responses:
        "201":
          description: Scheduled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/matches/{matchID}:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
      - $ref: "#/components/parameters/MatchID"
    get:
      operationId: getMatch
      summary: Read a match
      description: "Access: public."
      tags: [matches]
      security: []
      responses:
        "200":
          description: The match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMatch
      summary: Change the matchday or kickoff, or fill in the details
      description: |
        Access: league admin. At least one field is required (422 otherwise).
        Matchday and kickoff change only while the match is scheduled or postponed (409).
      tags: [matches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    delete:
      operationId: deleteMatch
      summary: Delete a match scheduled by mistake
      description: "Access: league admin. Only a scheduled match (409 otherwise)."
      tags: [matches]
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/matches/{matchID}/start:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
      - $ref: "#/components/parameters/MatchID"
    post:
      operationId: startMatch
      summary: Start a scheduled match
      description: "Access: league admin. The match becomes `live`, 0-0."
      tags: [matches]
      responses:
        "200":
          $ref: "#/components/responses/MatchOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/matches/{matchID}/score:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
      - $ref: "#/components/parameters/MatchID"
    put:
      operationId: setMatchScore
      summary: Set the score of a live match
      description: "Access: league admin."
      tags: [matches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
      responses:
        "200":
          $ref: "#/components/responses/MatchOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/matches/{matchID}/finish:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
      - $ref: "#/components/parameters/MatchID"
    post:
      operationId: finishMatch
      summary: Finish a live match
      description: "Access: league admin."
      tags: [matches]
      responses:
        "200":
          $ref: "#/components/responses/MatchOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/matches/{matchID}/postpone:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
      - $ref: "#/components/parameters/MatchID"
    post:
      operationId: postponeMatch
      summary: Postpone a scheduled match
      description: |
        Access: league admin. Without `kickoff_at`, the match becomes `postponed`.
        With it, the match is rescheduled at that time.
      tags: [matches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostponeRequest"
      responses:
        "200":
          $ref: "#/components/responses/MatchOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/matches/{matchID}/cancel:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
      - $ref: "#/components/parameters/MatchID"
    post:
      operationId: cancelMatch
      summary: Cancel a scheduled or postponed match
      description: "Access: league admin."
      tags: [matches]
      responses:
        "200":
          $ref: "#/components/responses/MatchOK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/leagues/{leagueID}/seasons/{seasonID}/standings:
    parameters:
      - $ref: "#/components/parameters/LeagueID"
      - $ref: "#/components/parameters/SeasonID"
    get:
      operationId: getStandings
      summary: Standings computed from the finished matches
      description: "Access: public."
      tags: [standings]
      security: []
      responses:
        "200":
          description: One row per registered team, best first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StandingRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
    bearerToken:
      type: http
      scheme: bearer

  parameters:
    LeagueID:
      name: leagueID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TeamID:
      name: teamID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PlayerID:
      name: playerID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SeasonID:
      name: seasonID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipID:
      name: membershipID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MatchID:
      name: matchID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationID:
      name: invitationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    MatchOK:
      description: The match after the change.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Match"
    BadRequest:
      description: Invalid ID in the path, invalid query parameter, or invalid JSON body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not logged in, or wrong credentials.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Logged in without the right access.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist in this league.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Refused by a business rule or the current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Field validation failed (`errors`), or a business rule refused the values (`error`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationErrors"
              - $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many requests to `/auth` or `/invitations` from this IP.
      content:
        text/plain:
          schema:
            type: string

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ValidationErrors:
      type: object
      required: [errors]
      properties:
        errors:
          type: object
          description: Field name to the failed validation rule (`required`, `max`, `uuid`…).
          additionalProperties:
            type: string
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    PasswordResetRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, password]
      additionalProperties: false
      properties:
        token:
          type: string
        password:
          type: string
          description: 10 characters to 72 bytes (422 otherwise).
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      additionalProperties: false
      properties:
        current_password:
          type: string
        new_password:
          type: string
          description: 10 characters to 72 bytes (422 otherwise).
    User:
      type: object
      required: [id, email, name, is_superadmin]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        is_superadmin:
          type: boolean
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          required: [leagues]
          properties:
            leagues:
              type: array
              items:
                $ref: "#/components/schemas/LeagueRef"

    InviteRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
    InvitationTokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
    AcceptInvitationRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
        name:
          type: string
          maxLength: 100
          description: Required when no account exists for the invited email.
        password:
          type: string
          description: Required when no account exists for the invited email. 10 characters to 72 bytes (422 otherwise).
    Invitation:
      type: object
      required: [id, email, expires_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        expires_at:
          type: string
          format: date-time
    CreatedInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          required: [link]
          properties:
            link:
              type: string
              format: uri
              description: Link to the admin web app with the token. Returned only here.
    PendingInvitation:
      type: object
      required: [email, league, account_exists]
      properties:
        email:
          type: string
        league:
          $ref: "#/components/schemas/LeagueRef"
        account_exists:
          type: boolean
    LeagueAdmin:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string

    LeagueRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    League:
      type: object
      required: [id, name, logo]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          type: [string, "null"]
          format: uri
    CreateLeagueRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 50
        logo:
          type: [string, "null"]
          format: uri

    UpdateLeagueRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 50
        logo:
          type: [string, "null"]
          format: uri

    TeamRef:
      type: object
      required: [id, name, logo]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          type: [string, "null"]
          format: uri
    Team:
      type: object
      required: [id, league_id, name, logo]
      properties:
        id:
          type: string
          format: uuid
        league_id:
          type: string
          format: uuid
        name:
          type: string
        logo:
          type: [string, "null"]
          format: uri
    CreateTeamRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 50
        logo:
          type: [string, "null"]
          format: uri

    UpdateTeamRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: [string, "null"]
          minLength: 1
          maxLength: 50
        logo:
          type: [string, "null"]
          format: uri

    Player:
      type: object
      required: [id, league_id, firstname, lastname, icon]
      properties:
        id:
          type: string
          format: uuid
        league_id:
          type: string
          format: uuid
        firstname:
          type: string
        lastname:
          type: string
        icon:
          type: [string, "null"]
          format: uri
    CreatePlayerRequest:
      type: object
      required: [firstname, lastname]
      additionalProperties: false
      properties:
        firstname:
          type: string
          maxLength: 50
        lastname:
          type: string
          maxLength: 50
        icon:
          type: [string, "null"]
          format: uri

    UpdatePlayerRequest:
      type: object
      additionalProperties: false
      properties:
        firstname:
          type: [string, "null"]
          minLength: 1
          maxLength: 50
        lastname:
